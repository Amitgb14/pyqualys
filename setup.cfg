[pep8]
# pyqualys/mcp/server.py is excluded from the pinned pep8 1.7.1 only.
# pep8 1.7.1 predates PEP 526 variable annotations and the PEP 8 rule
# that annotated defaults take spaces around "=", so it reports E701 and
# E251 on every dataclass field, pydantic field and typed tool argument.
# The file IS clean under modern pycodestyle - verify with:
#     python -m pycodestyle pyqualys/mcp/
exclude = .git,__pycache__,build,dist,pyqualys/mcp/server.py

[pycodestyle]
exclude = .git,__pycache__,build,dist
