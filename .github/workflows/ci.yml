name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pycodestyle
          pip install -e .
      - name: Install the mcp extra
        # The mcp SDK requires Python 3.10; pyqualys itself still runs
        # on 3.9, where the MCP tests skip themselves.
        if: matrix.python-version != '3.9'
        run: pip install 'mcp>=1.27,<2'
      - name: Lint
        # pycodestyle rather than the pinned pep8 1.7.1, because 1.7.1
        # predates PEP 526 annotations and cannot read pyqualys/mcp/.
        run: python -m pycodestyle .
      - name: Test
        run: |
          python -m unittest discover -s pyqualys/tests -t . \
            -p 'test_*.py' -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build an sdist and a wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
